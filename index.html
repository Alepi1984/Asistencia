<script>
// --- TU SCRIPT REPARADO ---

let turnoSel="",fotoData=null,fotoConMarca=null,latitud="N/D",longitud="N/D";

// ... (Funciones initFecha, cargarSelect, selTurno, cargarFoto, aplicarMarcaAgua se mantienen igual) ...
// (Las pego aquí resumidas para que veas el cambio en 'enviar')

async function enviar(){
  const sel=document.getElementById("trabajador");
  if(!sel.value){alert("Selecciona tu nombre.");return;}
  if(!turnoSel){alert("Selecciona Inicio o Fin de turno.");return;}
  if(!fotoConMarca){alert("Debes tomar una foto antes de registrar.");return;}
  
  const btn=document.getElementById("btn-enviar");
  btn.disabled=true;
  btn.textContent="Enviando datos...";
  document.getElementById("error-msg").style.display="none";

  const codigo=sel.value, nombre=sel.selectedOptions[0].text.split(" - ")[1];
  const tipo=turnoSel==="inicio"?"Inicio de turno":"Fin de turno";
  const fecha=document.getElementById("meta-fecha").textContent;
  const hora=document.getElementById("meta-hora").textContent;

  try {
    // PASO 1: Enviar datos (Esto sigue igual porque es poco texto)
    const url1 = SCRIPT_URL + "?accion=registro&codigo=" + encodeURIComponent(codigo) + "&nombre=" + encodeURIComponent(nombre) + "&tipo=" + encodeURIComponent(tipo) + "&fecha=" + encodeURIComponent(fecha) + "&hora=" + encodeURIComponent(hora) + "&latitud=" + encodeURIComponent(latitud) + "&longitud=" + encodeURIComponent(longitud);
    const r1 = await fetch(url1);
    const d1 = await r1.json();
    if(d1.status !== "ok") throw new Error(d1.message || "Error al guardar datos");

    // PASO 2: ENVIAR FOTO (Aquí está el cambio clave de GET a POST)
    btn.textContent = "Subiendo foto...";
    const fila = d1.fila;

    // Usamos POST para que la foto NO vaya en la URL y no dé error 413
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors", // Evita problemas de seguridad en navegadores móviles
      cache: "no-cache",
      body: JSON.stringify({
        accion: "foto",
        fila: fila,
        foto: fotoConMarca
      })
    });

    // Mostrar éxito inmediatamente
    document.getElementById("form-content").style.display="none";
    document.getElementById("success-panel").style.display="flex";
    document.getElementById("success-title").textContent=tipo+" registrado";
    document.getElementById("success-detail").innerHTML="<strong>"+nombre+"</strong><br>"+fecha+" a las "+hora+"<br><span style='font-size:12px;color:#9CA3AF'>GPS: "+latitud+", "+longitud+"</span>";
    
  } catch(err) {
    document.getElementById("error-msg").style.display="block";
    document.getElementById("error-msg").textContent="Error: " + err.message;
    btn.disabled=false;
    btn.textContent="Registrar asistencia";
  }
}

// ... (El resto de tus funciones como nuevoRegistro, abrirPin, etc., se mantienen igual) ...
</script>
